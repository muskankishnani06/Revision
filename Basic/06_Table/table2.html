<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Table</title>

    <style>
      table,
      tr,
      th,
      td {
        padding: 20px;
        border-spacing: 10px;
        border: solid black;
      }

      .day {
        background-color: violet;
      }
    </style>
  </head>
  <body>
    <table border>
      <thead>
        <tr>
          <th rowspan="2" class="day">Day</th>
          <th colspan="3">Seminar</th>
        </tr>

        <tr>
          <th>Begin</th>
          <th>End</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td rowspan="2">monday</td>
          <td rowspan="2">8</td>
          <td rowspan="2">5</td>
          <td>intro Xml</td>
        </tr>

        <tr>
          <td>validity dtd</td>
        </tr>

        <tr>
          <td rowspan="3">tuesday</td>
          <td>8</td>
          <td>12</td>
          <td rowspan="3">Xpath</td>
        </tr>

        <tr>
          <td>11</td>
          <td>3</td>
        </tr>
        <tr>
          <td>2</td>
          <td>5</td>
        </tr>

        <tr>
          <td class="day">wednesday</td>
          <td>8</td>
          <td>12</td>
          <td>Xsl formating</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>

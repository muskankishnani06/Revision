<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>inline elements</title>
  </head>
  <body>
    <!-- inline elements will take space as per they need do not start from new line  -->

    <!-- if want new line we need to take br tag -->

    <i>this is italic</i>

    <i>this is italic 2</i>

    <br />

    <b>this is bold </b>

    <br />

    <small>this is small </small>
    <br />

    <em>this is emphasis </em>

    <br />

    <strong>this is strong </strong>

    <br />

    <u>this is underline tag</u>

    <br />

    <p>h<sub>2</sub>o</p>

    <p>ab<sup>2</sup></p>

    <ins>this is inserted text</ins>
    <br />

    <del>this is deleted text</del>

    <br />

    <mark>this is marked text</mark>
  </body>
</html>
